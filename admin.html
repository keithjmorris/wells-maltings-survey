<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maltings — Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .manage-events {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .manage-events h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .add-event-row {
      display: grid;
      grid-template-columns: 1fr 160px auto;
      gap: 8px;
      margin-bottom: 1rem;
    }
    @media (max-width: 500px) {
      .add-event-row { grid-template-columns: 1fr; }
    }
    .event-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--color-background-secondary);
      border-radius: var(--radius);
      margin-bottom: 6px;
      font-size: 14px;
    }
    .event-list-item .event-date {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-left: 8px;
    }
    .event-list-empty {
      font-size: 13px;
      color: var(--color-text-tertiary);
      padding: 8px 0;
    }
    .btn-danger {
      background: none;
      border: none;
      color: #A32D2D;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 6px;
    }
    .btn-danger:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="page-wrap page-center">
    <div class="login-card">
      <div class="logo-mark" aria-hidden="true">WM</div>
      <h1 class="login-title">Admin area</h1>
      <p class="login-sub">Maltings survey dashboard</p>
      <div id="loginError" class="alert alert-error" style="display:none;"></div>
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn">Sign in</button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="adminScreen" style="display:none;">

    <div class="admin-bar">
      <div class="admin-bar-left">
        <div class="logo-mark small" aria-hidden="true">WM</div>
        <span class="admin-title">Survey dashboard</span>
      </div>
      <div class="admin-bar-right">
        <span id="adminEmail" class="admin-user"></span>
        <button class="btn btn-small" id="signOutBtn">Sign out</button>
      </div>
    </div>

    <div class="admin-wrap">

      <!-- Tab bar — three tabs -->
      <div class="admin-tabs">
        <button class="admin-tab tab-active" id="tabEvents">&#x1F3AD; Events</button>
        <button class="admin-tab" id="tabCafe">&#x2615; Café</button>
        <button class="admin-tab" id="tabAudience">&#x1F4CB; Audience survey</button>
      </div>

      <!-- Manage events panel — only shown on Events tab -->
      <div class="manage-events" id="manageEvents">
        <h3>&#x1F4C5; Manage events</h3>
        <div class="add-event-row">
          <input type="text" id="newEventLabel" placeholder="Event name (include date if multi-showing, e.g. Hamlet — 15 Aug)">
          <input type="date" id="newEventDate" title="Date for auto-fill on survey form">
          <button class="btn btn-primary" id="addEventBtn">Add</button>
        </div>
        <div id="eventListAdmin"><div class="event-list-empty">No events yet — add one above.</div></div>
      </div>

      <!-- Stat cards -->
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">Responses</div><div class="stat-val" id="statTotal">—</div></div>
        <div class="stat-card"><div class="stat-label" id="statLabel2">Avg rating</div><div class="stat-val" id="statAvg">—</div></div>
        <div class="stat-card"><div class="stat-label" id="statLabel3">Events covered</div><div class="stat-val" id="statEvents">—</div></div>
        <div class="stat-card"><div class="stat-label" id="statLabel4">Emails collected</div><div class="stat-val" id="statEmails">—</div></div>
      </div>

      <!-- Toolbar -->
      <div class="admin-toolbar">
        <!-- Event filters -->
        <div class="filter-row" id="eventFilters">
          <input type="text" id="filterEvent" placeholder="Filter by event name…">
          <select id="filterRating">
            <option value="">All ratings</option>
            <option value="5">5 stars</option>
            <option value="4">4 stars</option>
            <option value="3">3 stars</option>
            <option value="2">2 stars</option>
            <option value="1">1 star</option>
          </select>
        </div>
        <!-- Café filters -->
        <div class="filter-row" id="cafeFilters" style="display:none;">
          <input type="date" id="filterCafeDate">
          <select id="filterTimeOfDay">
            <option value="">All times of day</option>
            <option>Morning</option>
            <option>Lunchtime</option>
            <option>Afternoon</option>
            <option>Evening</option>
          </select>
        </div>
        <!-- Audience survey filters -->
        <div class="filter-row" id="audienceFilters" style="display:none;">
          <select id="filterEventType">
            <option value="">All event types</option>
            <option>Live classical music</option>
            <option>Live contemporary / popular music</option>
            <option>Live theatre</option>
            <option>Talk, lecture or discussion</option>
            <option>Theatre on screen</option>
            <option>Exhibition — visual arts</option>
            <option>Exhibition — crafts</option>
            <option>Dance performance</option>
            <option>Community event</option>
            <option>Hollywood / mainstream film</option>
            <option>Independent or foreign language film</option>
          </select>
          <select id="filterAudienceRating">
            <option value="">All overall ratings</option>
            <option value="4">4 — Excellent</option>
            <option value="3">3 — More than adequate</option>
            <option value="2">2 — OK</option>
            <option value="1">1 — Not good</option>
          </select>
        </div>
        <button class="btn btn-outline" id="csvBtn">&#8595; Download CSV</button>
      </div>

      <div id="loadingMsg" class="empty-state">Loading responses…</div>
      <div id="responseList"></div>

    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
