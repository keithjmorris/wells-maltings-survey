<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maltings — Event Feedback</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @font-face {
      font-family: 'RegimeUltra';
      src: url('regime-ultra.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    body {
      background-image: url('events-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 1.25rem 0.75rem 3rem;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 61, 0, 0.15);
      z-index: 0;
    }
    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 580px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.22);
      overflow: hidden;
      padding: 0;
    }
    .site-header {
      background: #FF3D00;
      border-radius: 0;
      padding: 18px 20px;
      margin-bottom: 0;
      gap: 10px;
    }
    .logo-mark {
      background: rgba(255,255,255,0.25);
      color: white;
      font-family: 'RegimeUltra', sans-serif;
      font-size: 16px;
      letter-spacing: 0.02em;
    }
    .site-name {
      color: white;
      font-family: 'RegimeUltra', sans-serif;
      font-size: 26px;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    .site-sub { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 3px; }
    main { padding: 0 0 1.5rem; }
    fieldset:first-of-type { margin-top: 12px; }

    /* Fieldsets — no border, padding only on sides and bottom */
    fieldset {
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 0 1.25rem 0.5rem;
      margin-bottom: 0;
      box-shadow: none;
    }

    /* Section bars — full width orange strips */
    legend {
      display: block;
      width: 100%;
      background: #FF3D00;
      color: white;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 1.25rem;
      margin: 0 0 1.25rem 0;
      border-radius: 0;
      box-sizing: border-box;
    }
    .legend-note {
      color: rgba(255,255,255,0.8);
      font-size: 10px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }

    /* Slightly darker input fields */
    input[type="text"],
    input[type="email"],
    input[type="date"],
    select,
    textarea {
      background: #efefef;
      border: 0.5px solid #ddd;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
      background: #fff;
    }

    .btn-primary { background: #FF3D00; border-color: #FF3D00; margin: 1rem 1.25rem 0; width: calc(100% - 2.5rem); }
    .btn-primary:hover { background: #CC3000; }
    .alert { margin: 1rem 1.25rem; }
    .notice { margin: 1rem 1.25rem 0; }
    #formError { margin: 0.5rem 1.25rem 0; }
  </style>
</head>
<body>

  <div class="page-wrap">
    <header class="site-header">
      <div class="logo-mark" aria-hidden="true">M</div>
      <div>
        <div class="site-name">MALTINGS</div>
        <div class="site-sub">Event feedback</div>
      </div>
    </header>

    <main>
      <div id="successMsg" class="alert alert-success" style="display:none;">
        <strong>Thank you!</strong> Your feedback has been recorded. We really appreciate you taking the time.
      </div>

      <form id="surveyForm" novalidate>

        <div class="notice" id="qrNotice" style="display:none;">
          &#x1F4F7; Event details have been pre-filled from the QR code.
        </div>

        <fieldset>
          <legend>About this event</legend>

          <div class="form-group">
            <label for="eventSelect">Event <span class="required">*</span></label>
            <select id="eventSelect" name="eventSelect">
              <option value="">Select an event…</option>
            </select>
          </div>
          <div class="form-group" id="otherEventWrap" style="display:none;">
            <label for="otherEventName">Event name <span class="required">*</span></label>
            <input type="text" id="otherEventName" placeholder="Please describe the event">
          </div>
          <div class="form-row two-col">
            <div class="form-group">
              <label for="eventDate">Date of event <span class="required">*</span></label>
              <input type="date" id="eventDate" name="eventDate" required>
            </div>
            <div class="form-group">
              <label for="eventName">Event name <span class="required">*</span></label>
              <input type="text" id="eventName" name="eventName" placeholder="e.g. Jazz at the Maltings" required>
            </div>
          </div>

          <div class="form-group">
            <label>Overall rating <span class="required">*</span></label>
            <div class="star-row" id="starRow" role="group" aria-label="Rate this event from 1 to 5 stars">
              <button type="button" class="star" data-value="1" aria-label="1 star — poor">&#9733;</button>
              <button type="button" class="star" data-value="2" aria-label="2 stars — below average">&#9733;</button>
              <button type="button" class="star" data-value="3" aria-label="3 stars — average">&#9733;</button>
              <button type="button" class="star" data-value="4" aria-label="4 stars — good">&#9733;</button>
              <button type="button" class="star" data-value="5" aria-label="5 stars — excellent">&#9733;</button>
            </div>
            <input type="hidden" id="rating" name="rating" value="0">
          </div>

          <div class="form-group">
            <label for="comments">Comments about this event</label>
            <textarea id="comments" name="comments" placeholder="What did you enjoy? Anything that could be improved?"></textarea>
          </div>

          <div class="form-group">
            <label for="suggestions">Suggestions for future events</label>
            <textarea id="suggestions" name="suggestions" placeholder="What would you like to see at Wells Maltings?"></textarea>
          </div>
        </fieldset>

        <fieldset>
          <legend>About you <span class="legend-note">— all optional, helps us plan better</span></legend>

          <div class="form-group">
            <label>How did you hear about this event?</label>
            <div class="chip-group" id="heardGroup" role="group" aria-label="How did you hear about this event">
              <button type="button" class="chip" data-group="heard">Social media</button>
              <button type="button" class="chip" data-group="heard">Email newsletter</button>
              <button type="button" class="chip" data-group="heard">Friend / word of mouth</button>
              <button type="button" class="chip" data-group="heard">Local press</button>
              <button type="button" class="chip" data-group="heard">Poster / flyer</button>
              <button type="button" class="chip" data-group="heard">Website</button>
              <button type="button" class="chip" data-group="heard">Walked past</button>
            </div>
          </div>

          <div class="form-group">
            <label for="eventSelect">Event <span class="required">*</span></label>
            <select id="eventSelect" name="eventSelect">
              <option value="">Select an event…</option>
            </select>
          </div>
          <div class="form-group" id="otherEventWrap" style="display:none;">
            <label for="otherEventName">Event name <span class="required">*</span></label>
            <input type="text" id="otherEventName" placeholder="Please describe the event">
          </div>
          <div class="form-row two-col">
            <div class="form-group">
              <label for="ageGroup">Age group</label>
              <select id="ageGroup" name="ageGroup">
                <option value="">Prefer not to say</option>
                <option>Under 18</option>
                <option>18–25</option>
                <option>26–35</option>
                <option>36–50</option>
                <option>51–65</option>
                <option>Over 65</option>
              </select>
            </div>
            <div class="form-group">
              <label for="visitFreq">How often do you attend?</label>
              <select id="visitFreq" name="visitFreq">
                <option value="">Prefer not to say</option>
                <option>First time</option>
                <option>Occasionally</option>
                <option>Regularly</option>
                <option>Member / subscriber</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="eventSelect">Event <span class="required">*</span></label>
            <select id="eventSelect" name="eventSelect">
              <option value="">Select an event…</option>
            </select>
          </div>
          <div class="form-group" id="otherEventWrap" style="display:none;">
            <label for="otherEventName">Event name <span class="required">*</span></label>
            <input type="text" id="otherEventName" placeholder="Please describe the event">
          </div>
          <div class="form-row two-col">
            <div class="form-group">
              <label for="postcode">Postcode</label>
              <input type="text" id="postcode" name="postcode" placeholder="e.g. NR23 1AB" maxlength="8">
            </div>
            <div class="form-group">
              <label for="email">Email address</label>
              <input type="email" id="email" name="email" placeholder="For event news and updates">
            </div>
          </div>

          <div class="form-group">
            <label>Would you like to join our mailing list?</label>
            <div class="chip-group" id="mailingGroup" role="group" aria-label="Mailing list preference">
              <button type="button" class="chip single" data-group="mailing">Yes please</button>
              <button type="button" class="chip single" data-group="mailing">No thanks</button>
            </div>
          </div>

          <div class="form-group">
            <label for="accessibility">Accessibility feedback</label>
            <textarea id="accessibility" name="accessibility" rows="3" placeholder="Any accessibility comments for our venue team?"></textarea>
          </div>
        </fieldset>

        <div id="formError" class="alert alert-error" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
          Submit feedback
        </button>

      </form>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
